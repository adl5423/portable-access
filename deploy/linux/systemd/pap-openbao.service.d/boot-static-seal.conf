[Unit]
Requires=pap-boot.service
After=pap-boot.service
StartLimitIntervalSec=0
ConditionPathExists=!/etc/pap/boot.locked

[Service]
LoadCredential=seal-current:/run/pap-boot/private/current.key
InaccessiblePaths=/run/pap-boot/private
# ConditionPathExists follows symlinks; this guard also blocks a dangling latch.
ExecStartPre=/usr/bin/test ! -L /etc/pap/boot.locked
