[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-access-reference"
version = "0.3.0"
description = "Portable Access Profile reference: isolated authority, external KMS and Netlify origin adapter"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.14.5,<4", "cryptography>=50.0.2,<51", "PyJWT>=2.15.1,<3", "pydantic>=2.14.1,<3"]
license = "Apache-2.0"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "pip-audit>=2.9,<3", "setuptools>=77", "wheel>=0.48,<1", "build>=1,<2"]

[project.scripts]
pap = "pap.cli:main"
pap-operator = "pap.operator.cli:main"

[tool.setuptools.packages.find]
include = ["pap*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
