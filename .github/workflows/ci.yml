name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/check-release.py
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m pytest -q deploy/instabox/tests
      - run: python -m pytest -q examples/docker-https/tests
      - run: python -m pip_audit --requirement requirements.lock --disable-pip
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Verify isolated images, fresh volumes and trusted HTTPS gateway
        run: python examples/docker-https/tests/container_acceptance.py
  node:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci --ignore-scripts && npm run check && npm audit --omit=dev
        working-directory: adapters/netlify
      - run: npm ci --ignore-scripts && npm run check && npm audit --omit=dev
        working-directory: adapters/netlify-seal
      - name: Check all independently configured examples
        shell: bash
        run: |
          set -euo pipefail
          for project in examples/space-briefing examples/charging-briefing examples/science-digest; do
            (cd "$project" && npm ci --ignore-scripts && npm run check && npm audit --omit=dev)
          done
  interoperability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: npm ci --ignore-scripts && npm run build
        working-directory: adapters/netlify
      - run: node tools/check-python-interop.mjs "$(command -v python)"
        working-directory: adapters/netlify
